<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>Notes</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme:dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Notes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  :root{
    --bg:#f5f5f7; --card:#fff; --ink:#1d1d1f; --dim:#6e6e73; --line:#d6d6db;
    --blue:#0071e3; --red:#d70015; --sh:0 2px 8px rgba(0,0,0,.06),0 20px 50px -20px rgba(0,0,0,.2);
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#000;--card:#1c1c1e;--ink:#f5f5f7;--dim:#98989d;--line:#38383a;
          --blue:#0a84ff;--red:#ff453a;--sh:0 2px 8px rgba(0,0,0,.6),0 20px 50px -20px rgba(0,0,0,.9)}
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);display:flex;
    align-items:center;justify-content:center;padding:24px;
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",
         "Segoe UI","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #gate{display:none;width:100%;max-width:352px;text-align:center}
  form{background:var(--card);border:1px solid var(--line);border-radius:22px;
       padding:34px 26px 26px;box-shadow:var(--sh)}
  .lock{font-size:34px;line-height:1;margin-bottom:14px}
  h1{font-size:20px;font-weight:600;letter-spacing:-.014em;margin:0 0 6px}
  #msg{font-size:13.5px;color:var(--dim);margin:0 0 20px;min-height:21px}
  #msg.err{color:var(--red)}
  input[type=password]{
    width:100%;font:16px/1.5 inherit;color:var(--ink);background:var(--bg);
    border:1px solid var(--line);border-radius:12px;padding:13px 15px;outline:none;
    transition:border-color .2s,box-shadow .2s;
  }
  input[type=password]:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(0,113,227,.15)}
  .rm{display:flex;align-items:center;gap:8px;justify-content:center;
      font-size:13px;color:var(--dim);margin:14px 0 18px;cursor:pointer;user-select:none}
  .rm input{width:16px;height:16px;accent-color:var(--blue)}
  button{
    width:100%;font:16px/1 inherit;font-weight:600;color:#fff;background:var(--blue);
    border:none;border-radius:12px;padding:14px;cursor:pointer;
    transition:transform .2s cubic-bezier(.32,.72,0,1),opacity .2s;
  }
  button:hover{opacity:.9}
  button:active{transform:scale(.97)}
  button:disabled{opacity:.5;cursor:default}
  .foot{margin-top:16px;font-size:12px;color:var(--dim)}
</style>
</head>
<body>

<div id="gate">
  <form id="f" autocomplete="off">
    <div class="lock">🔒</div>
    <h1>Notes</h1>
    <p id="msg">输入密码</p>
    <input id="pw" type="password" placeholder="密码" autocomplete="current-password"
           autocapitalize="off" autocorrect="off" spellcheck="false">
    <label class="rm"><input id="rmk" type="checkbox" checked>在这台设备上记住</label>
    <button id="go" type="submit">进入</button>
    <div class="foot">仅限本人使用</div>
  </form>
</div>

<noscript>
  <div style="max-width:320px;text-align:center;color:#6e6e73">
    这个页面需要 JavaScript,请在浏览器设置里打开。
  </div>
</noscript>

      .then(function (b) {
        return crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: b64d(D.salt), iterations: D.iter, hash: 'SHA-256' },
          b, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
      });
  }

  function reveal(html) {
    document.open();
    document.write(html);
    document.close();
  }
  function remember(key) {
    try {
      crypto.subtle.exportKey('raw', key).then(function (raw) {
        localStorage.setItem(LS, b64e(new Uint8Array(raw)));
      }).catch(function () {});
    } catch (e) { }
  }


  var saved = null;
  try { saved = localStorage.getItem(LS); } catch (e) {}

  if (saved) {

    crypto.subtle.importKey('raw', b64d(saved), { name: 'AES-GCM' }, true, ['decrypt'])
      .then(function (k) { return decryptWith(k); })
      .then(reveal)
      .catch(function () {
        try { localStorage.removeItem(LS); } catch (e) {}
        showGate('');
      });
    return;
  }

  showGate('输入密码');

  function showGate(text) {
    $('gate').style.display = 'block';
    $('msg').textContent = text;
    $('msg').className = '';
    $('pw').focus();
  }

  $('f').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var pw = $('pw').value;
    if (!pw) return;
    $('msg').className = '';
    $('msg').textContent = '处理中…';
    $('go').disabled = true;

    derive(pw)
      .then(function (k) {
        return decryptWith(k).then(function (html) {
          if ($('rmk').checked) remember(k);
          reveal(html);
        });
      })
      .catch(function () {
        $('msg').className = 'err';
        $('msg').textContent = '密码不对';
        $('go').disabled = false;
        $('pw').value = '';
        $('pw').focus();
      });
  });
})();
</script>
</body>
</html>
